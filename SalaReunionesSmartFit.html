<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SalaReunionesSmartFit</title>
    <style>
        body {
            background-color: #121212;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .background-slideshow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .background-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out;
        }

        .contenedor {
            background-color: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 30px 50px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }

        .logos-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .logo {
            height: 80px;
            width: auto;
            object-fit: contain;
        }

        img.logo {
            width: 250px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 28px;
            margin: 10px 0;
        }

        h2 {
            font-size: 20px;
            margin: 5px 0 30px 0;
            font-weight: normal;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 25px;
            justify-content: center;
            margin-top: 30px;
            max-width: 800px;
        }

        .boton {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 25px 20px;
            border-radius: 15px;
            min-height: 140px;
            position: relative;
            cursor: pointer;

            /* Estética moderna con bordes blancos */
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);

            /* Transiciones suaves */
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-style: preserve-3d;
        }

        .boton img {
            height: 50px !important;
            width: 100px !important;
            object-fit: scale-down;
            /* Esto escala la imagen hacia abajo si es muy grande */
            margin-bottom: 15px;
        }

        .boton:hover {
            transform: scale(1.05);
            background-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        @media (max-width: 768px) {
            .contenedor {
                padding: 20px;
                width: 85%;
            }

            .botones {
                gap: 20px;
            }

            .boton img {
                height: 80px;
                width: 80px;
            }
        }

        /* Menú Indicador */
        .menu-indicator {
            position: fixed;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.9;
            transition: all 0.3s ease;
        }

        .menu-indicator:hover {
            opacity: 1;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 1));
            transform: translateY(-50%) scale(1.1);
        }

        .menu-indicator:hover .menu-arrow::before {
            border-right: 12px solid rgba(255, 255, 255, 1);
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9));
        }

        .menu-indicator:hover .menu-text {
            color: rgba(255, 255, 255, 1);
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8),
                0 0 25px rgba(255, 255, 255, 0.5);
        }

        .menu-arrow {
            width: 25px;
            height: 25px;
            position: relative;
        }

        .menu-arrow::before {
            content: '';
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 12px solid rgba(255, 255, 255, 0.9);
        }

        .menu-text {
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
        }


        .footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 97%;
            height: 35px;
            /* Reducido de 120px a 60px */
            background-color: rgba(0, 0, 0, 0.6);
            /* Fondo oscuro */
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 30px;
            z-index: 50;
        }

        .footer-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 100%;
        }

        .footer-logos img {
            height: 35px;
            /* Logos pequeños */
            width: auto;
            object-fit: contain;
            opacity: 0.8;
            filter: brightness(0) invert(1);
            /* Convierte logos a blanco */
        }

        .footer-text {
            position: absolute;
            right: 30px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            text-align: right;
        }

        /* Ajuste del contenedor principal */
        .contenedor {
            margin-bottom: 80px;
            /* Para que no quede tapado */
        }

        @media (max-width: 768px) {
            .footer {
                height: 50px;
                padding: 0 15px;
            }

            .footer-logos img {
                height: 25px;
            }

            .footer-text {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="background-slideshow">
        <div class="background-image" style="background-image: url('imagenes/cielofit.jpg'); opacity: 1;"></div>
        <div class="background-image" style="background-image: url('imagenes/mancuernafit.jpg');"></div>
        <div class="background-image" style="background-image: url('imagenes/espejofit.jpg');"></div>
        <div class="background-image" style="background-image: url('imagenes/mancuernasfit2.jpg');"></div>
        <div class="background-image" style="background-image: url('imagenes/salaracefit.jpg');"></div>
    </div>
    <!-- Indicador de Menú -->
    <div class="menu-indicator">
        <div class="menu-arrow"></div>
        <span class="menu-text">Ayuda</span>
    </div>

    <div class="contenedor">
        <img src="imagenes/logo-smartfit.png" alt="Logo Smart Fit" class="logo">
        <h1>BIENVENIDOS</h1>
        <h2>BEM-VINDOS</h2>
        <div class="botones">
            <a class="boton" href="https://meet.google.com" target="_blank">
                <img src="imagenes/logo-meet.png" alt="Meet">
                <span class="boton-texto">Meet</span>
            </a>
            <a class="boton" href="https://zoom.us/join" target="_blank">
                <img src="imagenes/logo-zoom.png" alt="Zoom">
                <span class="boton-texto">Zoom</span>
            </a>
            <a class="boton" href="https://teams.live.com/free" target="_blank">
                <img src="imagenes/logo-teams.png" alt="Teams">
                <span class="boton-texto">Teams</span>
            </a>
            <a class="boton" href="https://www.youtube.com/" target="_blank">
                <img src="imagenes/logo-youtube.png" alt="Youtube">
                <span class="boton-texto">YouTube</span>
            </a>
        </div>
    </div>

    <div class="footer">
        <div class="footer-logos">
            <img src="imagenes/banner.png" alt="Banner">
        </div>
        <div class="footer-text">
            Smart Fit - Todos los derechos reservados. Versión 1.0
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const backgrounds = document.querySelectorAll('.background-image');
            let currentIndex = 0;

            // Función para cambiar el fondo
            function changeBackground() {
                // Ocultar todos los fondos
                backgrounds.forEach(bg => {
                    bg.style.opacity = 0;
                });

                // Mostrar el siguiente fondo
                currentIndex = (currentIndex + 1) % backgrounds.length;
                backgrounds[currentIndex].style.opacity = 1;

                // Programar el próximo cambio
                setTimeout(changeBackground, 10000); // Cambiar cada 10 segundos
            }

            // Iniciar el temporizador para el cambio de fondo
            setTimeout(changeBackground, 10000); // Primer cambio después de 10 segundos
        });
    </script>
</body>

</html>
